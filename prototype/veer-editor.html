<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veer · AI Editor</title>
<style>
:root {
  --bg:#f5f5f7; --bg-sb:#ebebeb; --bg-tb:rgba(245,245,247,0.88);
  --bg-chat:#ffffff; --sf:#ffffff; --sf2:#f0f0f4;
  --bd:rgba(0,0,0,0.09); --bd2:rgba(0,0,0,0.16);
  --fg:#1c1c1e; --fg2:#48484a; --fgm:#8e8e93;
  --acc:#1f9d55; --acc-fg:#ffffff; --acc-h:#1a8447;
  --warn:#b45309; --warn-bg:#fef3c7; --warn-bd:#fde68a;
  --err:#dc2626; --err-bg:#fee2e2; --err-bd:#fecaca;
  --info:#0066cc; --info-bg:#dbeafe;
  --add:rgba(34,197,94,0.13); --del:rgba(239,68,68,0.13);
  --gl-bg:rgba(255,255,255,0.72); --gl-bd:rgba(255,255,255,0.45); --gl-hi:rgba(255,255,255,0.65);
  --sh1:0 1px 3px rgba(0,0,0,0.09); --sh2:0 4px 16px rgba(0,0,0,0.12); --sh3:0 8px 32px rgba(0,0,0,0.15);
  color-scheme:light;
}
[data-theme="dark"] {
  --bg:#1c1c1e; --bg-sb:#252528; --bg-tb:rgba(28,28,30,0.88);
  --bg-chat:#2c2c2e; --sf:#3a3a3c; --sf2:#2c2c2e;
  --bd:rgba(255,255,255,0.1); --bd2:rgba(255,255,255,0.18);
  --fg:#f5f5f7; --fg2:#aeaeb2; --fgm:#636366;
  --acc:#30d158; --acc-fg:#001f0e; --acc-h:#3ce06a;
  --warn:#f59e0b; --warn-bg:rgba(245,158,11,0.14); --warn-bd:rgba(245,158,11,0.3);
  --err:#f87171; --err-bg:rgba(248,113,113,0.12); --err-bd:rgba(248,113,113,0.3);
  --info:#60a5fa; --info-bg:rgba(96,165,250,0.12);
  --add:rgba(48,209,88,0.13); --del:rgba(248,113,113,0.13);
  --gl-bg:rgba(50,50,54,0.78); --gl-bd:rgba(255,255,255,0.12); --gl-hi:rgba(255,255,255,0.07);
  --sh1:0 1px 3px rgba(0,0,0,0.3); --sh2:0 4px 16px rgba(0,0,0,0.4); --sh3:0 8px 32px rgba(0,0,0,0.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;font-size:13px;line-height:1.5;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit}
select{font-family:inherit;font-size:inherit}
textarea{font-family:inherit;font-size:inherit}
input{font-family:inherit;font-size:inherit}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100%;min-width:0}
#toolbar{display:flex;align-items:center;height:44px;padding:0 12px;background:var(--bg-tb);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--bd);flex-shrink:0;z-index:100;gap:6px;user-select:none}
@media(prefers-reduced-transparency:reduce){#toolbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg-sb)}}
#main-body{display:flex;flex:1;min-height:0;overflow:hidden}
#sidebar{width:240px;min-width:240px;display:flex;flex-direction:column;background:var(--bg-sb);border-right:1px solid var(--bd);flex-shrink:0;overflow:hidden;transition:width .2s ease,min-width .2s ease}
#sidebar.collapsed{width:0;min-width:0;border-right:none}
#content{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-chat);overflow:hidden;position:relative}
#inspector{width:340px;min-width:340px;display:flex;flex-direction:column;background:var(--bg-sb);border-left:1px solid var(--bd);flex-shrink:0;overflow:hidden;transition:width .2s ease,min-width .2s ease}
#inspector.collapsed{width:0;min-width:0;border-left:none}
#inspector.overlay{position:absolute;right:0;top:0;bottom:0;z-index:50;box-shadow:var(--sh3);min-width:300px!important;width:300px!important}
@media(prefers-reduced-motion:reduce){#sidebar,#inspector{transition:none}}

/* ── Traffic Lights ── */
.tls{display:flex;gap:8px;align-items:center;margin-right:4px;flex-shrink:0}
.tl{width:12px;height:12px;border-radius:50%;border:none;padding:0;cursor:default;flex-shrink:0}
.tl-r{background:#fe5f57}.tl-y{background:#febc2e}.tl-g{background:#28c840}

/* ── Toolbar elements ── */
.tb-btn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:none;background:transparent;color:var(--fg2);border-radius:6px;cursor:pointer;transition:background .1s;flex-shrink:0}
.tb-btn:hover{background:rgba(128,128,128,0.15);color:var(--fg)}
.tb-btn:disabled{opacity:.35;cursor:default}
.tb-btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tb-sep{width:1px;height:16px;background:var(--bd2);flex-shrink:0}
.tb-title-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;pointer-events:none;overflow:hidden}
.tb-title{font-size:13px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.tb-subtitle{font-size:11px;color:var(--fgm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-sel{font-size:11px;color:var(--fg2);background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:3px 6px;cursor:pointer;flex-shrink:0;max-width:165px}
.demo-sel:focus{outline:2px solid var(--acc)}

/* ── Sidebar ── */
.sb-top{padding:8px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sb-new{display:flex;align-items:center;gap:6px;width:100%;padding:7px 10px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;cursor:pointer;color:var(--fg2);font-size:13px;transition:background .1s}
.sb-new:hover{background:var(--sf2);color:var(--fg)}
.sb-new:focus-visible{outline:2px solid var(--acc)}
.sb-search{margin:8px 8px 4px;display:block;width:calc(100% - 16px);padding:6px 10px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;color:var(--fg);font-size:12px}
.sb-search:focus{outline:none;border-color:var(--acc)}
.sb-search::placeholder{color:var(--fgm)}
.session-list{flex:1;overflow-y:auto;padding:4px 8px}
.sess{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;position:relative}
.sess:hover{background:rgba(128,128,128,0.09)}
.sess.active{background:rgba(31,157,85,0.1)}
[data-theme="dark"] .sess.active{background:rgba(48,209,88,0.1)}
.sess-dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex-shrink:0;margin-top:5px}
.sess-dot.hidden{visibility:hidden}
.sess-info{flex:1;min-width:0}
.sess-name{font-size:13px;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-meta{font-size:11px;color:var(--fgm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-bottom{padding:8px;border-top:1px solid var(--bd);flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.sb-settings{display:flex;align-items:center;gap:6px;padding:6px 8px;background:transparent;border:none;color:var(--fg2);font-size:12px;border-radius:6px;cursor:pointer;width:100%;text-align:left}
.sb-settings:hover{background:rgba(128,128,128,0.1);color:var(--fg)}
.sb-settings:focus-visible{outline:2px solid var(--acc)}
.sb-privacy{font-size:10px;color:var(--fgm);line-height:1.4;padding:0 8px 2px}

/* ── Inspector ── */
.insp-tabs{display:flex;padding:8px 8px 0;gap:2px;border-bottom:1px solid var(--bd);flex-shrink:0}
.insp-tab{flex:1;padding:5px 2px;font-size:12px;font-weight:500;text-align:center;background:transparent;border:none;color:var(--fgm);cursor:pointer;border-radius:6px 6px 0 0;border-bottom:2px solid transparent;white-space:nowrap;transition:color .1s}
.insp-tab:hover{color:var(--fg)}
.insp-tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.insp-tab:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.insp-body{flex:1;overflow-y:auto;padding:12px}

/* ── Welcome ── */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;position:relative;overflow:auto}
.welcome.drag-over{background:rgba(31,157,85,0.06)}
.welcome.drag-over::after{content:'';position:absolute;inset:8px;border:2px dashed var(--acc);border-radius:16px;pointer-events:none}
.veer-logo{width:56px;height:56px;background:var(--acc);border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;flex-shrink:0}
.w-title{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.2;text-align:center;margin-bottom:8px}
.w-desc{font-size:13px;color:var(--fg2);text-align:center;max-width:420px;line-height:1.6;margin-bottom:32px}
.w-actions{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:320px}
.btn-gl{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;background:var(--gl-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--gl-bd);box-shadow:inset 0 1px 0 var(--gl-hi),var(--sh1);border-radius:999px;color:var(--acc);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;width:100%}
.btn-gl:hover{background:var(--acc);color:var(--acc-fg);border-color:transparent}
.btn-gl:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-transparency:reduce){.btn-gl{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--sf);border-color:var(--bd)}.btn-gl:hover{background:var(--acc);color:var(--acc-fg)}}
.w-sec-row{display:flex;gap:8px;width:100%;justify-content:center;flex-wrap:wrap}
.btn-ghost{display:flex;align-items:center;gap:5px;padding:7px 14px;background:transparent;border:1px solid var(--bd);border-radius:999px;color:var(--fg2);font-size:12px;font-weight:500;cursor:pointer;transition:all .1s;white-space:nowrap}
.btn-ghost:hover{background:var(--sf2);border-color:var(--bd2);color:var(--fg)}
.btn-ghost:focus-visible{outline:2px solid var(--acc)}
.w-privacy{position:absolute;bottom:16px;font-size:11px;color:var(--fgm);text-align:center}

/* ── Buttons ── */
.btn-pri{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:var(--acc);color:var(--acc-fg);border:none;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:background .1s;white-space:nowrap}
.btn-pri:hover{background:var(--acc-h)}
.btn-pri:disabled{opacity:.4;cursor:default}
.btn-pri:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn-pri-gl{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:var(--gl-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--gl-bd);box-shadow:inset 0 1px 0 var(--gl-hi),var(--sh1);border-radius:999px;color:var(--acc);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-pri-gl:hover{background:var(--acc);color:var(--acc-fg);border-color:transparent}
.btn-pri-gl:disabled{opacity:.4;cursor:default}
.btn-pri-gl:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-transparency:reduce){.btn-pri-gl{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--sf);border-color:var(--bd)}.btn-pri-gl:hover{background:var(--acc);color:var(--acc-fg)}}
.btn-neu{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--sf2);color:var(--fg2);border:1px solid var(--bd);border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;transition:background .1s}
.btn-neu:hover{background:var(--sf);color:var(--fg)}
.btn-neu:focus-visible{outline:2px solid var(--acc)}
.btn-txt{background:none;border:none;color:var(--acc);font-size:12px;cursor:pointer;padding:3px 2px}
.btn-txt:hover{text-decoration:underline}
.btn-txt:focus-visible{outline:2px solid var(--acc)}
.btn-sm{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:var(--sf2);border:1px solid var(--bd);border-radius:6px;font-size:12px;color:var(--fg2);cursor:pointer}
.btn-sm:hover{background:var(--sf);color:var(--fg)}
.btn-sm:focus-visible{outline:2px solid var(--acc)}

/* ── Outlet confirm ── */
.outlet-screen{flex:1;overflow-y:auto;padding:24px;max-width:700px;margin:0 auto;width:100%}
.sc-title{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:4px}
.sc-sub{font-size:13px;color:var(--fg2);margin-bottom:16px}
.inline-warn{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:10px;margin-bottom:14px}
.inline-warn svg{color:var(--warn);flex-shrink:0;margin-top:1px}
.inline-warn-t{font-size:12px;color:var(--warn);line-height:1.5}
.outlet-list{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.outlet-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sf);border:1px solid var(--bd);border-radius:6px}
.outlet-name{flex:1;font-size:13px;color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:999px;background:var(--sf2);color:var(--fgm);white-space:nowrap;flex-shrink:0}
.tag.group{background:rgba(0,102,204,0.1);color:var(--info)}
[data-theme="dark"] .tag.group{background:rgba(96,165,250,0.15)}
.reg-sel{font:12px/1 -apple-system,sans-serif;color:var(--fg);background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:3px 6px;cursor:pointer;flex-shrink:0}
.reg-sel:focus{outline:none;border-color:var(--acc)}
.note-txt{font-size:11px;color:var(--fgm);margin-bottom:18px}
.action-row{display:flex;gap:8px;align-items:center}

/* ── Chat ── */
.chat-area{flex:1;overflow-y:auto;padding:20px 24px 12px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.chat-hints{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:14px;padding:32px}
.hint-label{font-size:13px;color:var(--fgm)}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:580px}
.chip{padding:7px 14px;background:var(--sf2);border:1px solid var(--bd);border-radius:999px;font-size:12px;color:var(--fg2);cursor:pointer;transition:all .1s;white-space:nowrap}
.chip:hover{background:var(--acc);color:var(--acc-fg);border-color:transparent}
.chip:focus-visible{outline:2px solid var(--acc)}
.msg-user{display:flex;justify-content:flex-end;max-width:760px;align-self:flex-end;width:100%}
.msg-user-bub{background:var(--acc);color:var(--acc-fg);padding:10px 16px;border-radius:16px 16px 4px 16px;font-size:14px;line-height:1.5;max-width:68%}
.msg-asst{max-width:760px;align-self:flex-start;width:100%}
.steps-box{padding:12px 14px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;display:flex;flex-direction:column;gap:8px}
.step-row{display:flex;align-items:center;gap:8px;font-size:12px}
.step-done{color:var(--acc)}.step-active{color:var(--info)}.step-pend{color:var(--fgm)}
.spinner{width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--info);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none;border-top-color:var(--info)}}
.steps-summary{font-size:12px;color:var(--fgm);display:flex;align-items:center;gap:6px;cursor:pointer;padding:2px 0;background:none;border:none;text-align:left;width:100%}
.steps-summary:hover{color:var(--fg)}
.steps-summary:focus-visible{outline:2px solid var(--acc)}
.review-sum{font-size:14px;font-weight:500;margin-bottom:10px;color:var(--fg)}
.change-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px}
.change-info{flex:1;min-width:0}
.change-title{font-size:13px;font-weight:500;color:var(--fg);font-family:'SF Mono','Menlo','Monaco','Consolas',monospace}
.change-meta{font-size:11px;color:var(--fgm);margin-top:3px}
.change-replace{font-size:11px;color:var(--fgm);margin-top:4px}
.change-replace code{background:var(--del);color:var(--err);padding:1px 4px;border-radius:3px;font-size:10px;font-family:monospace}
.toggle{width:32px;height:18px;background:var(--fgm);border-radius:999px;position:relative;cursor:pointer;border:none;flex-shrink:0;transition:background .15s;margin-top:2px}
.toggle.on{background:var(--acc)}
.toggle::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,0.2)}
.toggle.on::after{left:16px}
.toggle:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.toggle,.toggle::after{transition:none}}
.val-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:5px 10px;border-radius:999px;margin:8px 0}
.val-badge.pass{background:rgba(31,157,85,0.1);color:var(--acc);border:1px solid rgba(31,157,85,0.2)}
[data-theme="dark"] .val-badge.pass{background:rgba(48,209,88,0.12);border-color:rgba(48,209,88,0.25)}
.val-badge.fail{background:var(--err-bg);color:var(--err);border:1px solid var(--err-bd)}
.val-badge.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.review-actions{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.written-row{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(31,157,85,0.08);border:1px solid rgba(31,157,85,0.2);border-radius:10px;margin-top:8px}
[data-theme="dark"] .written-row{background:rgba(48,209,88,0.1);border-color:rgba(48,209,88,0.22)}
.written-label{font-size:13px;font-weight:500;color:var(--acc);flex:1}
.asst-text{font-size:14px;line-height:1.6;color:var(--fg)}
.asst-text p{margin-bottom:8px}
.error-block{padding:14px;background:var(--err-bg);border:1px solid var(--err-bd);border-radius:10px}
.error-title{font-size:13px;font-weight:600;color:var(--err);margin-bottom:4px}
.error-desc{font-size:12px;color:var(--fg2);line-height:1.6;margin-bottom:10px}
.error-acts{display:flex;gap:8px;flex-wrap:wrap}
.qr-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qchip{padding:5px 12px;background:var(--sf2);border:1px solid var(--bd);border-radius:999px;font-size:12px;color:var(--acc);cursor:pointer;transition:all .1s}
.qchip:hover{background:var(--acc);color:var(--acc-fg);border-color:transparent}
.qchip:focus-visible{outline:2px solid var(--acc)}
.stale-notice{padding:8px 12px;background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:8px;font-size:12px;color:var(--warn);margin-top:6px}

/* ── Input bar ── */
#ibar{padding:10px 16px;border-top:1px solid var(--bd);flex-shrink:0;position:relative}
.input-outer{background:var(--gl-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--gl-bd);box-shadow:inset 0 1px 0 var(--gl-hi),var(--sh1);border-radius:16px;overflow:hidden}
@media(prefers-reduced-transparency:reduce){.input-outer{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--sf);border-color:var(--bd)}}
#msg-input{width:100%;padding:10px 14px 0;background:transparent;border:none;font:14px/1.5 -apple-system,sans-serif;color:var(--fg);resize:none;min-height:38px;max-height:160px;overflow-y:auto;outline:none;display:block}
#msg-input::placeholder{color:var(--fgm)}
.ibar-bottom{display:flex;align-items:center;justify-content:space-between;padding:5px 10px 8px;gap:8px}
.ibar-hint{font-size:10px;color:var(--fgm)}
.mode-btn{display:flex;align-items:center;gap:5px;padding:4px 10px;background:var(--sf2);border:1px solid var(--bd);border-radius:999px;font-size:11px;color:var(--fg2);cursor:pointer;flex-shrink:0}
.mode-btn:hover{color:var(--fg)}
.mode-btn:focus-visible{outline:2px solid var(--acc)}
.send-btn{width:32px;height:32px;background:var(--acc);color:var(--acc-fg);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .1s}
.send-btn:hover{background:var(--acc-h)}
.send-btn:disabled{opacity:.35;cursor:default}
.send-btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stop-btn{width:32px;height:32px;background:var(--err);color:#fff;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .1s}
.stop-btn:hover{background:#b91c1c}
.stop-btn:focus-visible{outline:2px solid var(--err);outline-offset:2px}
#ac-popup{position:absolute;bottom:calc(100% + 2px);left:16px;right:16px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh2);overflow:hidden;z-index:200;display:none}

.ac-header{font-size:10px;font-weight:600;color:var(--fgm);padding:6px 12px 4px;text-transform:uppercase;letter-spacing:.06em}
.ac-item{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:13px}

.ac-name{flex:1;font-weight:500}
.ac-meta{font-size:11px;color:var(--fgm)}
.ac-tag{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--sf2);color:var(--fgm)}

/* ── Inspector content ── */
.diff-toggles{display:flex;gap:4px;margin-bottom:10px}
.dtg-btn{padding:4px 10px;font-size:11px;font-weight:500;background:transparent;border:1px solid var(--bd);border-radius:6px;cursor:pointer;color:var(--fgm);transition:all .1s}
.dtg-btn.active{background:var(--acc);color:var(--acc-fg);border-color:transparent}
.dtg-btn:focus-visible{outline:2px solid var(--acc)}
.diff-view{font:11px/1.6 'SF Mono','Menlo','Monaco','Consolas',monospace;border:1px solid var(--bd);border-radius:6px;overflow-x:auto;background:var(--sf)}
.dl{display:flex;align-items:flex-start;padding:0 6px;white-space:pre}
.dl.add{background:var(--add)}.dl.del{background:var(--del)}
.dl-num{width:28px;color:var(--fgm);user-select:none;flex-shrink:0;text-align:right;padding-right:8px}
.dl-pfx{width:14px;flex-shrink:0}
.dl.add .dl-pfx{color:var(--acc)}.dl.del .dl-pfx{color:var(--err)}
.dl-txt{flex:1;color:var(--fg);overflow:visible}
.diff-fold{padding:3px 6px;color:var(--fgm);font-size:10px;background:var(--sf2);cursor:pointer;display:flex;align-items:center;gap:4px;border:none;width:100%;text-align:left}
.diff-fold:hover{color:var(--fg)}
.rules-filter{width:100%;padding:6px 10px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;color:var(--fg);font-size:12px;margin-bottom:8px}
.rules-filter:focus{outline:none;border-color:var(--acc)}
.rules-tbl{width:100%;border-collapse:collapse;font-size:11px}
.rules-tbl th{text-align:left;padding:4px 6px;color:var(--fgm);font-weight:500;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg-sb)}
.rules-tbl td{padding:5px 6px;border-bottom:1px solid var(--bd);color:var(--fg2);vertical-align:top;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rules-tbl tr:hover td{background:rgba(128,128,128,0.05)}
.badge-new{font-size:9px;padding:1px 5px;border-radius:999px;background:rgba(31,157,85,0.15);color:var(--acc);font-weight:600}

.mono{font-family:'SF Mono','Menlo',monospace;font-size:10px}
.test-row{display:flex;gap:6px;margin-bottom:12px}
.test-in{flex:1;padding:6px 10px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;color:var(--fg);font-size:12px;font-family:'SF Mono','Menlo',monospace}
.test-in:focus{outline:none;border-color:var(--acc)}
.btn-test{padding:6px 12px;background:var(--acc);color:var(--acc-fg);border:none;border-radius:10px;font-size:12px;font-weight:500;cursor:pointer}
.btn-test:hover{background:var(--acc-h)}
.btn-test:focus-visible{outline:2px solid var(--acc)}
.test-res{padding:10px 12px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;font-size:12px;line-height:1.7}
.tr-line{color:var(--fg2)}.tr-match{color:var(--acc);font-weight:500}.tr-skip{color:var(--warn)}
.outlet-tab-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--bd)}
.otr-name{flex:1;font-size:12px;font-weight:500;color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.otr-type{font-size:10px;color:var(--fgm);padding:2px 6px;background:var(--sf2);border-radius:999px;flex-shrink:0}

/* ── Sheet ── */
.sheet-ov{position:fixed;inset:0;background:rgba(0,0,0,0.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:500;display:none;align-items:center;justify-content:center}
.sheet-ov.show{display:flex}
@media(prefers-reduced-transparency:reduce){.sheet-ov{backdrop-filter:none;-webkit-backdrop-filter:none}}
.sheet{background:var(--sf);border-radius:16px;box-shadow:var(--sh3);width:480px;max-width:calc(100vw - 48px);max-height:calc(100vh - 80px);overflow-y:auto;border:1px solid var(--bd)}
.sheet.wide{width:560px}
.sheet-hd{display:flex;align-items:center;padding:16px 20px 12px;border-bottom:1px solid var(--bd)}
.sheet-ti{font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1}
.sheet-x{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--sf2);border:none;border-radius:50%;cursor:pointer;color:var(--fgm)}
.sheet-x:hover{color:var(--fg);background:var(--bd2)}
.sheet-x:focus-visible{outline:2px solid var(--acc)}
.sheet-bd{padding:16px 20px 20px}
.stabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid var(--bd)}
.stab{padding:8px 16px;font-size:13px;font-weight:500;background:transparent;border:none;color:var(--fgm);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.stab:hover{color:var(--fg)}
.stab.active{color:var(--acc);border-bottom-color:var(--acc)}
.stab:focus-visible{outline:2px solid var(--acc)}
.fg{margin-bottom:14px}
.fl{font-size:12px;font-weight:500;color:var(--fg2);margin-bottom:5px;display:block}
.fi{width:100%;padding:7px 10px;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;color:var(--fg);font-size:13px}
.fi:focus{outline:none;border-color:var(--acc)}
.fsel{width:100%;padding:7px 10px;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;color:var(--fg);font-size:13px;cursor:pointer}
.fsel:focus{outline:none;border-color:var(--acc)}
.key-wrap{position:relative}
.key-st{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--acc)}
.frow{display:flex;gap:8px;align-items:flex-end}
.frow .fg{flex:1;margin-bottom:0}
.btn-conn{padding:7px 14px;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;font-size:12px;color:var(--fg2);cursor:pointer;white-space:nowrap}
.btn-conn:hover{background:var(--sf);color:var(--fg)}
.btn-conn:focus-visible{outline:2px solid var(--acc)}
.conn-ok{font-size:11px;color:var(--acc);margin-top:6px}
.conn-fail{font-size:11px;color:var(--err);margin-top:6px}
.ck-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ck-lbl{font-size:13px;color:var(--fg)}
input[type=checkbox]{accent-color:var(--acc);width:14px;height:14px;cursor:pointer}
.priv-section h4{font-size:13px;font-weight:600;margin-bottom:6px}
.priv-section p{font-size:12px;color:var(--fg2);line-height:1.6;margin-bottom:10px}
.priv-code{background:var(--sf2);padding:8px 10px;border-radius:6px;font-family:'SF Mono','Menlo',monospace;font-size:11px;color:var(--fg2);margin-bottom:10px;line-height:1.7}
.priv-unsent{font-size:11px;color:var(--fgm);padding:6px 10px;background:var(--warn-bg);border-radius:6px;border:1px solid var(--warn-bd)}
.export-stats{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eplus{color:var(--acc);font-weight:600}.eminus{color:var(--err);font-weight:600}
.export-note{font-size:11px;color:var(--fgm);margin-top:6px}
.export-ck-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);margin:12px 0}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ── Subscription sheet ── */
.sub-states .sub-idle,.sub-states .sub-loading,.sub-states .sub-error{display:none}
.sub-states.idle .sub-idle,.sub-states.loading .sub-loading,.sub-states.error .sub-error{display:block}
.loading-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg2);padding:8px 0}
.loading-row .spinner{width:16px;height:16px;border-width:2px}

/* ── Toast ── */
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--gl-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--gl-bd);box-shadow:var(--sh2),inset 0 1px 0 var(--gl-hi);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:500;color:var(--fg);z-index:1000;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
@media(prefers-reduced-transparency:reduce){#toast{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--sf)}}

/* ── Misc ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.28);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,0.45)}
</style>

// ── SVG helpers ────────────────────────────────────────────────────
function svgCheck(color){
  // CSS variables require style attr, not SVG presentation attr
  var s = color || 'currentColor';
  return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="stroke:'+s+';flex-shrink:0;display:inline-block;vertical-align:middle" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,7 5.5,10.5 12,4"/></svg>';
}
function svgWarn(){
  return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2L13 12H1z"/><line x1="7" y1="6" x2="7" y2="9"/><circle cx="7" cy="11" r=".5" fill="currentColor"/></svg>';
}
function svgInfo(){
  return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="5.5"/><line x1="7" y1="6" x2="7" y2="10"/><circle cx="7" cy="4.5" r=".5" fill="currentColor"/></svg>';
}
function svgErr(){
  return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="5.5"/><line x1="9" y1="5" x2="5" y2="9"/><line x1="5" y1="5" x2="9" y2="9"/></svg>';
}
function svgChevron(dir){
  var d = dir==='up' ? 'M3,9 L7,5 11,9' : 'M3,5 L7,9 11,5';
  return '<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="'+d+'"/></svg>';
}

  els.tbTitle.textContent = inChat ? '我的配置.yaml' : 'Veer · AI Editor';

function renderDiff(){
  var lines = [
    {type:'ctx', n:1, text:'rule-providers:'},
    {type:'add', n:null, text:'  netflix: {type: http, behavior: domain, format: mrs,'},
    {type:'add', n:null, text:'    url: ...geosite/netflix.mrs, interval: 86400}'},
    {type:'add', n:null, text:'  openai: {type: http, behavior: domain, format: mrs,'},
    {type:'add', n:null, text:'    url: ...geosite/openai.mrs, interval: 86400}'},
    {type:'fold', text:'… 18 行未改动'},
    {type:'ctx', n:20, text:'rules:'},
    {type:'add', n:null, text:'  - RULE-SET,netflix,日本出口'},
    {type:'add', n:null, text:'  - RULE-SET,openai,美国出口'},
    {type:'del', n:22, text:'  - DOMAIN-SUFFIX,openai.com,DIRECT'},
    {type:'ctx', n:23, text:'  - DOMAIN-SUFFIX,example.com,DIRECT'},
    {type:'fold', text:'… 7 行未改动'},
  ];

  var addN = 4, delN = 1;
  var lineHtml = lines.map(function(l){
    if(l.type==='fold'){
      return '<button class="diff-fold" style="width:100%;display:flex;align-items:center;gap:4px;padding:3px 8px">'+svgChevron('down')+'&nbsp;'+l.text+'</button>';
    }
    var cls = l.type==='add'?'dl add':l.type==='del'?'dl del':'dl';
    var pfx = l.type==='add'?'+':l.type==='del'?'−':' ';

// ── Escape HTML ────────────────────────────────────────────────────
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Global click handler (event delegation) ────────────────────────
document.addEventListener('click', function(e){
  var el = e.target;
  // Walk up to find data-action
  while(el && el !== document.body){
    var action = el.getAttribute('data-action');
    if(action){ handleAction(action, el); return; }
    // Inspector tabs
    if(el.classList.contains('insp-tab')){
      S.inspTab = el.getAttribute('data-tab');
      renderInspector();
      return;
    }
    // Diff toggles
    if(el.classList.contains('dtg-btn')){
      el.parentNode.querySelectorAll('.dtg-btn').forEach(function(b){ b.classList.remove('active'); });
      el.classList.add('active');
      return;
    }
    // Settings tabs
    if(el.hasAttribute('data-stab')){
      S.settingsTab = el.getAttribute('data-stab');
      renderSettings();
      return;
    }
    // Session items
    if(el.classList.contains('sess') || el.closest('.sess')){
      var sess = el.classList.contains('sess') ? el : el.closest('.sess');
      SESSIONS.forEach(function(s){ s.active = s.id === sess.getAttribute('data-sid'); });
      renderSessions();
      return;
    }
    el = el.parentElement;
  }
});

function handleAction(action, el){
  if(action==='import-file'){
    S.view = 'outlet-confirm';
    renderView();
  } else if(action==='try-example'){
    S.view = 'outlet-confirm';
    renderView();
  } else if(action==='sub-link'){
    S.subState = 'idle';
    openSheet('sub-link');
  } else if(action==='paste-yaml'){
    S.view = 'outlet-confirm';
    renderView();
  } else if(action==='start-edit'){
    S.view = 'chat';
    S.chatState = 'empty';
    S.written = false;
    S.undoStack = [];
    S.redoStack = [];
    renderView();
  } else if(action==='skip-outlet'){
    S.view = 'chat';
    S.chatState = 'empty';
    renderView();
  } else if(action==='send-chip'){
    var msg = el.getAttribute('data-msg');
    startGenerating(msg);
  } else if(action==='toggle-steps'){
    S.stepsExpanded = !S.stepsExpanded;
    renderChat();
    var ca = document.getElementById('chat-area');
    if(ca) ca.scrollTop = ca.scrollHeight;
  } else if(action==='toggle-accept'){
    var idx = parseInt(el.getAttribute('data-idx'), 10);
    S.accepts[idx] = !S.accepts[idx];
    renderChat();
    renderInspector();
    var ca = document.getElementById('chat-area');
    if(ca) ca.scrollTop = ca.scrollHeight;
  } else if(action==='write-draft'){
    S.undoStack.push({chatState:'review', written:false, accepts:[S.accepts[0],S.accepts[1]]});
    S.redoStack = [];
    S.chatState = 'written';
    S.written = true;
    updateToolbar();
    renderChat();
    showToast('已写入草稿，尚未导出');
    renderInspector();
  } else if(action==='undo-write'){
    if(S.undoStack.length > 0){
      var prev = S.undoStack.pop();
      S.redoStack.push({chatState:'written', written:true, accepts:[S.accepts[0],S.accepts[1]]});
      S.chatState = prev.chatState;
      S.written = prev.written;
      S.accepts = prev.accepts;
      updateToolbar();
      renderChat();
      renderInspector();
      showToast('已撤销');
    }
  } else if(action==='discard'){
    S.chatState = 'empty';
    S.accepts = [true, true];
    renderChat();
  } else if(action==='show-diff'){
    S.inspTab = 'changes';
    if(!S.inspOpen){ S.inspOpen = true; }
    renderView();
    els.inspector.classList.remove('collapsed');
  } else if(action==='ai-payload'){
    openSheet('ai-payload');
  } else if(action==='close-sheet'){
    closeSheet();
  } else if(action==='do-export'){
    closeSheet();
    showToast('已导出到 我的配置-draft.yaml');
  } else if(action==='sub-import'){
    var inp2 = document.getElementById('sub-url-input');
    if(inp2 && inp2.value.trim()){
      S.subState = 'loading';
      renderSubLink();
      setTimeout(function(){
        S.subState = 'error';
        renderSubLink();
      }, 1800);
    }
  } else if(action==='sub-retry'){
    S.subState = 'idle';
    renderSubLink();
  } else if(action==='qreply'){
    var qmsg = el.getAttribute('data-msg');
    startGenerating(qmsg);
  } else if(action==='open-settings'){
    S.settingsTab = 'ai';
    openSheet('settings');
  } else if(action==='local-mode'){
    S.aiMode = false;
    els.modeLabel.textContent = '本地解析';
    S.chatState = 'empty';
    renderChat();
    showToast('已切换为本地解析模式');
  } else if(action==='retry'){
    startGenerating('Netflix 走日本，ChatGPT 走美国');
  } else if(action==='test-conn'){
    var btn2 = document.getElementById('btn-conn');
    if(btn2){ btn2.textContent = '测试中…'; btn2.disabled = true; }
    setTimeout(function(){
      S.connectResult = 'ok';
      renderSettings();
    }, 1200);
  }
}

  msgInput.addEventListener('keydown', function(e){
    if(e.key === 'Escape') hideAC();
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
      e.preventDefault();
      var v = msgInput.value.trim();
      if(v && S.view === 'chat' && S.chatState !== 'generating'){
        msgInput.value = '';
        msgInput.style.height = '';
        hideAC();
        startGenerating(v);
      }
    }
  });
}

els.btnSend.addEventListener('click', function(){
  var v = msgInput ? msgInput.value.trim() : '';
  if(v && S.view === 'chat' && S.chatState !== 'generating'){
    if(msgInput){ msgInput.value = ''; msgInput.style.height = ''; }
    hideAC();
    startGenerating(v);
  }
});

// Stop button (delegated, added dynamically)
document.addEventListener('click', function(e){
  if(e.target && (e.target.id === 'btn-stop' || e.target.closest && e.target.closest('#btn-stop'))){
    if(S.genTimer){ clearTimeout(S.genTimer); S.genTimer = null; }
    S.chatState = 'empty';
    renderView();
  }
});

// Mode toggle
els.modeBtn.addEventListener('click', function(){
  S.aiMode = !S.aiMode;
  els.modeLabel.textContent = S.aiMode ? 'AI · deepseek-chat' : '本地解析';
});

// Sheet overlay backdrop close
els.sheetOv.addEventListener('click', function(e){
  if(e.target === els.sheetOv) closeSheet();
});

// Keyboard: Escape closes sheet
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(S.sheet) closeSheet();
    hideAC();
  }
});

// Resize: check overlay
window.addEventListener('resize', function(){
  checkOverlay();
});

// prefers-color-scheme listener
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e){
  if(document.documentElement.getAttribute('data-theme') !== 'light' || e.matches){
    S.dark = e.matches;
    applyTheme();
  }
});

// ── Init ───────────────────────────────────────────────────────────
applyTheme();
renderSessions();
renderView();

})();
</script>
</body>
</html>
